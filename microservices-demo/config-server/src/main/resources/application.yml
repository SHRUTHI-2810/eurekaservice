server:
  port: 8888

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          # Point this at your real Git repo (GitHub/GitLab/Bitbucket/on-prem).
          # For local testing, the ../config-repo folder in this project is
          # already a git repo you can use with a file:// URI - see README.md.
          uri: file://${user.home}/microservices-demo/config-repo
          default-label: main
          clone-on-start: true
          # For a private HTTPS repo:
          # username: ${GIT_USERNAME}
          # password: ${GIT_TOKEN}
          # For SSH:
          # uri: git@github.com:your-org/config-repo.git
          # ignore-local-ssh-settings: true
          # private-key: ${GIT_SSH_PRIVATE_KEY}
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/busrefresh here re-broadcasts a refresh signal to every
        # service subscribed to the bus (order-service, payment-service, ...)
        include: health,info,busrefresh,bus-refresh
